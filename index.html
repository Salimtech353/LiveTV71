<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetPlay IPTV Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Modern Dark IPTV Background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(rgba(10, 15, 30, 0.85), rgba(10, 15, 30, 0.85)), 
                  url('https://raw.githubusercontent.com/Salimtech353/NetPlay/main/Admin_panel_bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Glassmorphic Floating Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                  0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 123, 255, 0.2);
    }

    h3 {
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 600;
      color: #00d2ff;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    label {
      font-size: 13px;
      color: #cfd8dc;
      font-weight: 500;
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    /* Glass Inputs */
    input[type="text"], 
    input[type="email"], 
    input[type="password"], 
    input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, 
    input[type="email"]:focus, 
    input[type="password"]:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    input::placeholder {
      color: #a0aec0;
    }

    /* Modern Buttons */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
      margin-top: 12px;
    }

    .btn-danger:hover {
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.5);
    }

    .hidden {
      display: none;
    }

    /* Status Glass Container */
    .status-msg {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
      word-break: break-all;
      backdrop-filter: blur(10px);
    }

    .success {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid rgba(40, 167, 69, 0.5);
      color: #81c784;
    }

    .error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.5);
      color: #e57373;
    }

    .link-box {
      margin-top: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed #00d2ff;
      border-radius: 8px;
    }

    .link-box a {
      color: #00d2ff;
      text-decoration: none;
      font-weight: 600;
    }

    /* Radio Group Glass Styling */
    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .radio-group label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }

    .radio-group input[type="radio"] {
      accent-color: #00d2ff;
      cursor: pointer;
      width: auto;
    }

    .input-box {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>IPTV JSON Admin Panel</h2>

    <!-- Step 1: Login Form -->
    <div id="login-card" class="glass-card">
      <h3>Admin Login</h3>
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@example.com">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
      <button id="btn-login">Login to Dashboard</button>
    </div>

    <!-- Step 2: Dashboard (Visible after login) -->
    <div id="dashboard-card" class="glass-card hidden">
      <h3>m3u Input & Replace JSON</h3>
      
      <label>Select Input Method:</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="input-type" value="url" checked> M3U Link / URL
        </label>
        <label>
          <input type="radio" name="input-type" value="file"> Upload M3U File
        </label>
      </div>

      <!-- Option 1: URL Input Box -->
      <div id="url-box" class="input-box">
        <label>M3U Link/URL</label>
        <input type="text" id="m3u-url" placeholder="https://example.com/playlist.m3u">
      </div>

      <!-- Option 2: File Upload Box -->
      <div id="file-box" class="input-box hidden">
        <label>Upload M3U File (.m3u / .m3u8)</label>
        <input type="file" id="m3u-file" accept=".m3u,.m3u8,.txt">
      </div>

      <button id="btn-process">Generate & Replace JSON</button>
      <button id="btn-logout" class="btn-danger">Logout</button>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <!-- Firebase JavaScript SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFi38rpZeaE3YiUYPPGIf1kdN1bmZkeMs",
      authDomain: "iptv-admin-954a5.firebaseapp.com",
      databaseURL: "https://iptv-admin-954a5-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "iptv-admin-954a5",
      storageBucket: "iptv-admin-954a5.firebasestorage.app",
      messagingSenderId: "903898414295",
      appId: "1:903898414295:web:d4f84dca135c8af9c70492"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginCard = document.getElementById('login-card');
    const dashboardCard = document.getElementById('dashboard-card');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const btnProcess = document.getElementById('btn-process');
    const statusDiv = document.getElementById('status');
    const m3uUrlInput = document.getElementById('m3u-url');
    const m3uFileInput = document.getElementById('m3u-file');
    
    const urlBox = document.getElementById('url-box');
    const fileBox = document.getElementById('file-box');
    const radioInputs = document.querySelectorAll('input[name="input-type"]');

    const directJsonUrl = "https://iptv-admin-954a5-default-rtdb.asia-southeast1.firebasedatabase.app/channels.json";

    // Radio Toggle Logic
    radioInputs.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'url') {
          urlBox.classList.remove('hidden');
          fileBox.classList.add('hidden');
        } else {
          fileBox.classList.remove('hidden');
          urlBox.classList.add('hidden');
        }
      });
    });

    function showStatus(htmlContent, isError = false) {
      statusDiv.style.display = 'block';
      statusDiv.className = 'status-msg ' + (isError ? 'error' : 'success');
      statusDiv.innerHTML = htmlContent;
    }

    // Auth Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginCard.classList.add('hidden');
        dashboardCard.classList.remove('hidden');

        if (localStorage.getItem('saved_m3u_url')) {
          m3uUrlInput.value = localStorage.getItem('saved_m3u_url');
        }

        try {
          const snapshot = await get(ref(db, 'channels'));
          if (snapshot.exists()) {
            const count = snapshot.val().length;
            showStatus(`
              ✅ বর্তমানে ডাটাবেসে ${count} টি চ্যানেল সেভ রয়েছে!<br><br>
              <b>আপনার স্থায়ী channels.json ফাইলের লিংক:</b>
              <div class="link-box"><a href="${directJsonUrl}" target="_blank">${directJsonUrl}</a></div>
            `);
          }
        } catch (e) {
          console.log("Error loading DB status", e);
        }

      } else {
        loginCard.classList.remove('hidden');
        dashboardCard.classList.add('hidden');
        statusDiv.style.display = 'none';
      }
    });

    btnLogin.addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!email || !pass) {
        alert("ইমেইল এবং পাসওয়ার্ড দিন!");
        return;
      }

      signInWithEmailAndPassword(auth, email, pass)
        .catch(err => alert("Login Failed: " + err.message));
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    // Parser Function
    function parseM3U(m3uContent) {
      const lines = m3uContent.split('\n');
      const playlist = [];
      let currentItem = {};

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIndex = line.lastIndexOf(',');
          currentItem.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Unknown Channel";

          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          currentItem.logo = logoMatch && logoMatch[1] ? logoMatch[1] : "";

          const categoryMatch = line.match(/group-title="([^"]*)"/i);
          currentItem.category = categoryMatch && categoryMatch[1] ? categoryMatch[1] : "General";

        } else if (line && !line.startsWith('#')) {
          currentItem.url = line;
          playlist.push({
            name: currentItem.name || "Unknown Channel",
            logo: currentItem.logo || "",
            category: currentItem.category || "General",
            url: currentItem.url
          });
          currentItem = {};
        }
      }
      return playlist;
    }

    // Process Action
    btnProcess.addEventListener('click', async () => {
      const selectedType = document.querySelector('input[name="input-type"]:checked').value;
      const url = m3uUrlInput.value.trim();
      const file = m3uFileInput.files[0];
      let m3uData = "";

      statusDiv.style.display = 'none';

      if (selectedType === 'file') {
        if (!file) {
          showStatus("দয়া করে একটি M3U ফাইল সিলেক্ট করুন!", true);
          return;
        }
        btnProcess.innerText = "Reading File...";
        try {
          m3uData = await file.text();
        } catch (e) {
          btnProcess.innerText = "Generate & Replace JSON";
          showStatus("Error: ফাইল রিড করা যায়নি! " + e.message, true);
          return;
        }
      } else {
        if (!url) {
          showStatus("দয়া করে M3U লিংক ইনপুট দিন!", true);
          return;
        }
        btnProcess.innerText = "Processing URL...";
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("URL থেকে ফাইল লোড করা যায়নি!");
          m3uData = await response.text();
          localStorage.setItem('saved_m3u_url', url);
        } catch (e) {
          btnProcess.innerText = "Generate & Replace JSON";
          showStatus("Error: CORS ব্লক অথবা ভুল লিংক! " + e.message, true);
          return;
        }
      }

      btnProcess.innerText = "Parsing Data...";
      const jsonResult = parseM3U(m3uData);

      if (jsonResult.length === 0) {
        btnProcess.innerText = "Generate & Replace JSON";
        showStatus("কোনো ভ্যালিড m3u চ্যানেল ডাটা পাওয়া যায়নি!", true);
        return;
      }

      btnProcess.innerText = "Updating Realtime Database...";

      try {
        await set(ref(db, 'channels'), jsonResult);

        m3uFileInput.value = "";

        btnProcess.innerText = "Generate & Replace JSON";
        showStatus(`
          ✅ সফলভাবে ${jsonResult.length} টি চ্যানেল নতুন স্ট্রাকচারে সেভ হয়েছে!<br><br>
          <b>আপনার স্থায়ী channels.json ফাইলের লিংক:</b>
          <div class="link-box"><a href="${directJsonUrl}" target="_blank">${directJsonUrl}</a></div>
        `);
      } catch (error) {
        btnProcess.innerText = "Generate & Replace JSON";
        showStatus("Database Error: " + error.message, true);
      }
    });
  </script>
</body>
</html>
